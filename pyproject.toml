[project]
name = "autoapply"
version = "0.1.0"
description = "A job-search copilot: finds and scores jobs, drafts tailored applications with Claude, and you submit from your own browser."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=1.15",
    "playwright>=1.49",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
]

[project.scripts]
autoapply = "autoapply.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoapply*"]

[tool.setuptools.package-data]
autoapply = ["templates/*.j2", "web/templates/*.html", "web/static/*", "apply/*.js"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["network: hits real job-board APIs"]
