  willing_to_relocate: null
  start_date: "Two weeks after offer"
  notice_period: "Two weeks"
  remote_preference: "Remote or hybrid"

eeo:                           # "Decline" picks the decline/prefer-not option
  gender: Decline
  pronouns: ""
  race_ethnicity: Decline
  hispanic_latino: Decline
  veteran_status: Decline
  disability_status: Decline
  sexual_orientation: Decline
  transgender: Decline

summary: >-
  Two or three sentences about you.

