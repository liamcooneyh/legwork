  last_name: Doe
  preferred_name: ""
  email: jane@example.com
  phone: "555-555-0100"
  location: {city: New York, state: NY, country: United States}
  linkedin: https://www.linkedin.com/in/janedoe
  github: ""
  website: ""

work_authorization:
  authorized_us: null          # true / false
  requires_sponsorship: null   # true / false
  notes: ""

preferences:
