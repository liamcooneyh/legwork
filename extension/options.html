<!doctype html>
<html><head><meta charset="utf-8"><title>Auto-Apply Fill</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; color: #23202a; background: #faf6ef; margin: 0; padding: 16px; min-width: 340px; }
  h1 { font-size: 17px; margin: 0 0 4px; } p { margin: 4px 0 12px; color: #5d5867; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 10px; border: 1.5px solid #2b2731; border-radius: 10px; background: #fff; }
  button { margin-top: 14px; font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 10px; border: 1.5px solid #2b2731; background: #ff7ab6; cursor: pointer; }
  #status { margin-top: 10px; font-weight: 600; }
</style></head>
<body>
  <h1>Auto-Apply Fill</h1>
  <p>Connects to your dashboard so it can fill application pages from your prepared drafts.</p>
  <label for="url">Dashboard address</label><input id="url" placeholder="https://your-app.fly.dev">
  <label for="user">Dashboard username</label><input id="user" placeholder="admin">
  <label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password">
  <button id="save">Save and test</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body></html>
